name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, or-solver]

    env:
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          printf "%s" "${{ secrets.ENVIRONMENT }}" > .env

      - name: Deploy
        run: |
          docker compose up -d --build

      - name: Cleanup
        run: docker image prune -f